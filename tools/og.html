<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Ảnh xem trước khi gửi link (1200x630). Cần ảnh trong anh/ (python tools/xu_ly_anh.py). Chụp lại: python tools/chup_og.py -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,400&family=Ephesis&display=block" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ban) var(--noise); }
  .khung { position: absolute; inset: 22px; background: var(--giay) var(--noise); box-shadow: 0 2px 4px rgba(60,45,30,.15), 0 20px 50px -20px rgba(60,45,30,.45); overflow: hidden; }
  /* Ảnh cưới trong ô vòm bên trái, viền chỉ nhũ */
  .vom-og { position: absolute; left: 40px; top: 30px; bottom: 30px; width: 400px; border-radius: 200px 200px 8px 8px; overflow: hidden; box-shadow: 0 20px 40px -24px rgba(60,45,30,.6); }
  .vom-og img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .vom-og::after { content: ""; position: absolute; inset: 9px; border: 1.5px solid rgba(240,222,178,.95); border-radius: 191px 191px 4px 4px; }
  .hoa { position: absolute; right: -150px; top: -60px; width: 640px; height: 485px; opacity: .95; }
  .hoa-kho .canh, .hoa-kho .day { stroke-dashoffset: 0; }
  .hoa-kho .la, .hoa-kho .bong { transform: none; opacity: 1; }
  .chu { position: absolute; left: 490px; top: 112px; width: 640px; }
  .moi { margin: 0 0 4px 8px; font: 600 18px/1 var(--chu-in); letter-spacing: .2em; text-transform: uppercase; color: var(--muc-nhat); }
  .ten { margin: 0; font: 400 96px/1.08 var(--chu-tha); }
  .ten-2 { padding-left: 110px; }
  .va { margin: -6px 0 -6px 170px; display: flex; }
  .va svg { width: 60px; height: 36px; }
  .va path { fill: var(--tim); }
  .va path + path { fill: #D47A70; }
  .ngay { margin: 28px 0 0 10px; display: flex; align-items: center; font: 600 36px/1.2 var(--chu-in); letter-spacing: .05em; color: var(--muc); }
  .ngay .vach { height: 1.1em; }
  .noi { margin: 10px 0 0 10px; font: italic 24px/1.3 var(--chu-in); color: var(--muc-nhat); }
  .chu-nhu { animation: none; filter: drop-shadow(0 1px 0 rgba(255,255,255,.6)) drop-shadow(0 1px 1px rgba(90,60,25,.25)); background-position: 30% 0; }
</style>
</head>
<body>
  <div class="khung">
    <div class="hoa" id="hoa"></div>
    <div class="vom-og"><img id="anh-og" alt=""></div>
    <div class="chu">
      <p class="moi">Trân trọng kính mời</p>
      <p class="ten"><span class="chu-nhu">Quang Thắng</span></p>
      <p class="va"><svg viewBox="0 0 44 26"><path d="M13 23C3 15 2 7 7 4c3-2 6 0 6 3 0-3 3-5 6-3 5 3 4 11-6 16z"/><path d="M29 23c-9-7-10-14-5-17 3-2 6 0 6 3 0-3 3-5 6-3 5 3 4 11-7 17z"/></svg></p>
      <p class="ten ten-2"><span class="chu-nhu">Ngọc Ánh</span></p>
      <p class="ngay"><span>Thứ Bảy</span><span class="vach"></span><span>28 . 11 . 2026</span></p>
      <p class="noi">11 giờ, Tầng 2 Khách sạn Sailing, Hà Tĩnh</p>
    </div>
  </div>
  <script src="../album.js"></script>
  <script>
    // Ảnh "og" trong tools/thu_tu_anh.json (đã cắt sát người); chưa chọn thì lấy ảnh trên cùng của xấp ảnh trên thiệp
    document.getElementById('anh-og').src = '../' + (ALBUM.rieng.og || ALBUM.anh[ALBUM.noiBat[0] - 1]).l;
  </script>
  <script src="../flora.js"></script>
  <script>
    document.getElementById('hoa').innerHTML = HoaKho.bo({ w: 620, h: 470, goc: [670, 470], vung: { cx: 440, cy: 120, rx: 200, ry: 95 }, so: 24, hat: 5, co: 6, boCongAnh: [{ dx: 0.05, dy: -0.4 }] });
  </script>
</body>
</html>
